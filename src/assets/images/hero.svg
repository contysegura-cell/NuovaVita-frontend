<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Ilustración de cuidado y hogar">
  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="480" height="360" rx="24" fill="#F1E9DA"/>
  <!-- Sol / halo (salvia claro) -->
  <circle cx="360" cy="110" r="70" fill="#8A9A7B" opacity="0.35"/>
  <!-- Casa (hogar) -->
  <rect x="120" y="170" width="180" height="130" rx="10" fill="#FFFFFF" stroke="#C5714E" stroke-width="4"/>
  <!-- Techo -->
  <path d="M108 172 L210 100 L312 172 Z" fill="#C5714E"/>
  <!-- Puerta -->
  <rect x="196" y="228" width="48" height="72" rx="6" fill="#8A9A7B"/>
  <!-- Ventana -->
  <rect x="140" y="200" width="40" height="40" rx="6" fill="#F1E9DA" stroke="#6F7D63" stroke-width="3"/>
  <!-- Corazón (cuidado) sobre la casa -->
  <path d="M210 150 c-10 -12 -30 -4 -30 12 c0 14 22 26 30 32 c8 -6 30 -18 30 -32 c0 -16 -20 -24 -30 -12 Z" fill="#C5714E"/>
  <!-- Suelo / planta -->
  <path d="M40 300 h400" stroke="#6F7D63" stroke-width="4" stroke-linecap="round"/>
  <circle cx="360" cy="285" r="16" fill="#8A9A7B"/>
  <path d="M360 285 v-30" stroke="#6F7D63" stroke-width="3" stroke-linecap="round"/>
</svg>
